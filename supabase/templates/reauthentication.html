<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f4f0;
      font-family:
        Inter,
        Segoe UI,
        Helvetica,
        Arial,
        sans-serif;
      color: #1f2a2e;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 16px 0; font-size: 14px; font-weight: 600; color: #01525e">
            Kesher · École Abravanel
          </p>
          <h1 style="margin: 0 0 12px 0; font-size: 22px; line-height: 1.3">
            Votre code de vérification
          </h1>
          <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.5">
            Saisissez ce code pour confirmer une action sensible sur votre compte. Il expire dans
            quelques minutes.
          </p>
          <p
            style="
              margin: 0 0 24px 0;
              font-size: 32px;
              letter-spacing: 6px;
              font-weight: 700;
              color: #01525e;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5c6b70">
            Enter this code to confirm a sensitive action on your account. It expires in a few
            minutes.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
