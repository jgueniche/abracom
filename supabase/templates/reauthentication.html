<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f3f8fe;
      font-family:
        Inter,
        Segoe UI,
        Helvetica,
        Arial,
        sans-serif;
      color: #0f1e33;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px">
          <p
            style="
              margin: 0 0 14px 0;
              font-size: 12px;
              font-weight: 600;
              letter-spacing: 0.07em;
              text-transform: uppercase;
              color: #0038b8;
            "
          >
            Kesher · École Abravanel
          </p>
          <h1
            style="
              margin: 0 0 12px 0;
              font-family: Georgia, &quot;Times New Roman&quot;, serif;
              font-size: 25px;
              font-weight: 400;
              line-height: 1.25;
              letter-spacing: -0.01em;
            "
          >
            Votre code de vérification
          </h1>
          <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.5">
            Saisissez ce code pour confirmer une action sensible sur votre compte. Il expire dans
            quelques minutes.
          </p>
          <p
            style="
              margin: 0 0 24px 0;
              font-size: 32px;
              letter-spacing: 6px;
              font-weight: 700;
              color: #0038b8;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #55657c">
            Enter this code to confirm a sensitive action on your account. It expires in a few
            minutes.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
