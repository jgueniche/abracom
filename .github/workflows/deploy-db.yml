name: Deploy database

# Applies the versioned migrations to the Supabase project through the Management API, which needs
# a single secret (SUPABASE_ACCESS_TOKEN, a personal access token) and no database password. The
# project reference is versioned in supabase/config.toml ([remotes.*].project_id) and can be
# overridden by the repository variable SUPABASE_PROJECT_REF. Without the secret the job is a no-op.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
      - "scripts/ops/apply-migrations.sh"

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the project reference
        id: project
        run: |
          ref="${{ vars.SUPABASE_PROJECT_REF }}"
          if [ -z "$ref" ]; then
            ref=$(awk '/^\[remotes\./ {block=1} block && /project_id/ {gsub(/[" ]/, "", $3); print $3; exit}' supabase/config.toml)
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ref" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN or the project reference is missing — deployment skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "::notice::Target project: $ref"
          fi

      - name: Apply the migrations
        if: steps.project.outputs.ready == 'true'
        run: scripts/ops/apply-migrations.sh "${{ steps.project.outputs.ref }}"

      # `config push` overwrites the hosted auth settings with those of config.toml, so it only runs
      # when the repository variable SUPABASE_CONFIG_PUSH is set to "true".
      - uses: supabase/setup-cli@v1
        if: steps.project.outputs.ready == 'true' && vars.SUPABASE_CONFIG_PUSH == 'true'
        with:
          version: latest

      - name: Auth configuration
        if: steps.project.outputs.ready == 'true' && vars.SUPABASE_CONFIG_PUSH == 'true'
        run: |
          supabase config diff --project-ref "${{ steps.project.outputs.ref }}"
          supabase config push --project-ref "${{ steps.project.outputs.ref }}" < /dev/null
