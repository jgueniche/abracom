name: Deploy database

# Applies the versioned migrations (and the auth configuration / e-mail templates of
# supabase/config.toml) to the linked Supabase project. Runs on demand, or on every push to
# `main` that touches the migrations. Skipped silently while the secrets are not set:
#   SUPABASE_ACCESS_TOKEN   personal access token (Supabase dashboard → Account → Access tokens)
#   SUPABASE_PROJECT_REF    project reference (20 characters)
#   SUPABASE_DB_PASSWORD    database password of the project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/templates/**"

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not set — deployment skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase migration list
          supabase db push

      # `config push` overwrites the hosted auth settings with those of config.toml, so it only
      # runs once a [remotes.<name>] block for the project exists (docs/DEPLOIEMENT.md) and the
      # repository variable SUPABASE_CONFIG_PUSH is set to "true".
      - name: Auth configuration and e-mail templates
        if: steps.secrets.outputs.configured == 'true' && vars.SUPABASE_CONFIG_PUSH == 'true'
        run: |
          supabase config diff
          supabase config push < /dev/null
